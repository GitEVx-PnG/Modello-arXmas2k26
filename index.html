<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visualizza in AR</title>
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
  <style>
    html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#111;color:#fff}
    .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
    model-viewer{width:100%;height:70vh;max-width:900px;background:#222;border-radius:18px}
    h1{margin:0 0 12px;font-size:26px;text-align:center}
    p{margin:0 0 18px;text-align:center;opacity:.8}
    button{margin-top:18px;padding:15px 24px;border:0;border-radius:999px;font-size:17px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Visualizza il modello in AR</h1>
    <p>Ruota il modello oppure aprilo nella tua stanza.</p>

    <model-viewer
      src="Photo_3D.glb"
      alt="Modello 3D"
      camera-controls
      auto-rotate
      ar
      ar-modes="scene-viewer webxr quick-look"
      shadow-intensity="1"
      exposure="1">
      <button slot="ar-button">📷 Visualizza in AR</button>
    </model-viewer>
  </div>
</body>
</html>
